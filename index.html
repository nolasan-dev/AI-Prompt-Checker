<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AIプロンプトチェッカー (AI Prompt Checker)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Analytics 4 (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YP8SRTJMH4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YP8SRTJMH4');
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans p-3 sm:p-6 md:p-8">

  <!-- Header -->
  <header class="max-w-4xl w-full mx-auto mb-3 sm:mb-5 pb-3 border-b border-slate-800">
    <div class="flex items-start justify-between gap-2">
      <!-- Title & Subtitle -->
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-xl sm:text-2xl">🔍</span>
          <h1 id="tMainTitle" class="text-lg sm:text-2xl font-bold tracking-tight text-white whitespace-nowrap">AIプロンプトチェッカー</h1>
          <span class="text-[11px] font-mono text-indigo-400 bg-indigo-950/80 px-1.5 py-0.5 rounded border border-indigo-800/60">V1.0</span>
        </div>
        <p id="tSubTitle" class="text-[11px] sm:text-xs text-slate-400 mt-1 leading-snug">
          <span>NovelAI / Stable Diffusion (WebUI・Forge・ComfyUI)</span><br class="block">
          <span>PNGメタデータ直接解析・RAW抽出ツール</span>
        </p>
      </div>

      <!-- Actions: Language Toggle & Support Buttons (右上固定・コンパクト配置) -->
      <div class="flex flex-col sm:flex-row items-end sm:items-center gap-1.5 shrink-0">
        <!-- Language Switcher -->
        <div class="inline-flex rounded-md bg-slate-800 p-0.5 border border-slate-700 text-[11px]">
          <button id="langJpBtn" onclick="switchLang('ja')" class="px-2 py-0.5 rounded font-medium transition bg-indigo-600 text-white">JP</button>
          <button id="langEnBtn" onclick="switchLang('en')" class="px-2 py-0.5 rounded font-medium transition text-slate-400 hover:text-slate-200">EN</button>
        </div>

        <!-- Support Buttons -->
        <div class="flex items-center gap-1.5">
          <a href="https://ofuse.me/4729099c" target="_blank" rel="noopener noreferrer"
             onclick="trackDonate('ofuse')"
             class="flex items-center gap-1 px-2 py-1 rounded-md bg-orange-600/20 hover:bg-orange-600/30 text-orange-400 border border-orange-500/30 text-[11px] font-semibold transition whitespace-nowrap">
            <span>🧡</span>
            <span id="tOfuseBtn">OFUSE</span>
          </a>
          <a href="https://buymeacoffee.com/nolasan" target="_blank" rel="noopener noreferrer"
             onclick="trackDonate('buymeacoffee')"
             class="flex items-center gap-1 px-2 py-1 rounded-md bg-yellow-600/20 hover:bg-yellow-600/30 text-yellow-400 border border-yellow-500/30 text-[11px] font-semibold transition whitespace-nowrap">
            <span>☕</span>
            <span class="hidden sm:inline">Buy Me a Coffee</span>
            <span class="sm:hidden">Coffee</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col space-y-2.5">

    <!-- Compatibility & Privacy Notice -->
    <div class="text-[11px] bg-slate-800/50 border border-slate-700/50 rounded-lg px-3 py-2 flex items-start sm:items-center gap-2 text-slate-300 leading-snug">
      <span class="text-emerald-400 shrink-0 mt-0.5 sm:mt-0">🛡️</span>
      <span id="tNotice">
        <strong class="text-indigo-300">完全ローカル解析：</strong>
        NovelAI・SDに加え、Fooocus / InvokeAI / クリスタ / Photoshop等のメタデータ付きPNGもすべて抽出可能です（外部送信ゼロ）。
      </span>
    </div>

    <!-- Drop Zone / File Input (コンパクト化：高さを大幅圧縮) -->
    <label id="dropZone" class="group border border-dashed border-slate-700 hover:border-indigo-500/70 bg-slate-800/30 hover:bg-slate-800/70 transition-all rounded-xl p-3 sm:p-4 text-center cursor-pointer flex items-center justify-center gap-3">
      <div class="w-8 h-8 rounded-full bg-indigo-500/10 group-hover:bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-base shrink-0">
        📥
      </div>
      <div class="text-left min-w-0">
        <div id="tDropTitle" class="text-xs sm:text-sm font-semibold text-slate-200 truncate">
          PNG画像を選択 / ドロップ
        </div>
        <div id="tDropSub1" class="text-[10px] sm:text-xs text-slate-400 truncate">
          NovelAI / Stable Diffusion (WebUI・Forge・ComfyUI)
        </div>
      </div>
      <input type="file" id="f" accept="image/png" class="hidden">
    </label>

    <!-- Controls & Status Bar -->
    <div class="flex items-center justify-between gap-2 pt-0.5">
      <div id="fileInfo" class="text-[11px] font-mono text-indigo-300 truncate max-w-[65%] sm:max-w-[75%]">
        ファイル未選択
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="copyBtn" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-[11px] font-medium transition flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
          <span>📋</span>
          <span id="copyBtnText">コピー</span>
        </button>
        <button id="clearBtn" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 border border-slate-700 text-[11px] font-medium transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>
          クリア
        </button>
      </div>
    </div>

    <!-- Output Textarea (画面いっぱいに広げる) -->
    <div class="flex-1 min-h-[460px] sm:min-h-[520px] flex flex-col">
      <textarea id="out" readonly spellcheck="false" placeholder="ここに解析されたメタデータ（JSONフォーマット）が表示されます..." class="w-full flex-1 min-h-[460px] rounded-xl bg-slate-950 border border-slate-800 p-3 font-mono text-xs text-sky-400 focus:outline-none focus:border-indigo-500/50 resize-y leading-relaxed"></textarea>
    </div>
  </main>

  <footer class="max-w-4xl w-full mx-auto mt-3 text-center text-[10px] text-slate-400 pb-2">
    NAI Matrix Utilities &copy; 2026
  </footer>

  <!-- 暗号化.html と互換性を保つための id="appCoreScript" -->
  <script id="appCoreScript">
    const fileInput = document.getElementById('f');
    const dropZone = document.getElementById('dropZone');
    const outputArea = document.getElementById('out');
    const fileInfo = document.getElementById('fileInfo');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const clearBtn = document.getElementById('clearBtn');
    const langJpBtn = document.getElementById('langJpBtn');
    const langEnBtn = document.getElementById('langEnBtn');

    // 多言語辞書定義
    const I18N = {
      ja: {
        mainTitle: 'AIプロンプトチェッカー',
        subTitle: '<span>NovelAI / Stable Diffusion (WebUI・Forge・ComfyUI)</span><br class="block"><span>PNGメタデータ直接解析・RAW抽出ツール</span>',
        ofuseBtn: 'OFUSE',
        notice: '<strong class="text-indigo-300">完全ローカル解析：</strong> NovelAI・SDに加え、Fooocus / InvokeAI / クリスタ / Photoshop等のメタデータ付きPNGもすべて抽出可能です（外部送信ゼロ）。',
        dropTitle: 'PNG画像を選択 / ドロップ',
        dropSub1: 'NovelAI / Stable Diffusion (WebUI・Forge・ComfyUI)',
        noFile: 'ファイル未選択',
        copyJson: 'コピー',
        copied: '完了！',
        clear: 'クリア',
        placeholder: 'ここに解析されたメタデータ（JSONフォーマット）が表示されます...',
        alertPng: 'PNG画像ファイルを選択してください。',
        analyzing: '解析中',
        detectedLabel: '判定',
        chunkCountLabel: 'チャンク',
        errorPrefix: '解析エラー: '
      },
      en: {
        mainTitle: 'AI Prompt Checker',
        subTitle: '<span>NovelAI / Stable Diffusion (WebUI・Forge・ComfyUI)</span><br class="block"><span>Direct PNG Metadata & RAW Inspector</span>',
        ofuseBtn: 'OFUSE',
        notice: '<strong class="text-indigo-300">100% Local & Universal:</strong> Fully extracts metadata from NovelAI, SD, Fooocus, InvokeAI, CLIP STUDIO, Photoshop, and more. Zero external uploads.',
        dropTitle: 'Select or Drop PNG',
        dropSub1: 'NovelAI / Stable Diffusion (WebUI / Forge / ComfyUI)',
        noFile: 'No file selected',
        copyJson: 'Copy',
        copied: 'Copied!',
        clear: 'Clear',
        placeholder: 'Parsed metadata (JSON) will be displayed here...',
        alertPng: 'Please select a valid PNG image file.',
        analyzing: 'Analyzing',
        detectedLabel: 'Detected',
        chunkCountLabel: 'Chunks',
        errorPrefix: 'Error: '
      }
    };

    let currentLang = 'ja';
    let lastLoadedFileInfo = null;

    // 言語切り替え処理
    function switchLang(lang) {
      currentLang = lang;
      const dict = I18N[lang];

      document.getElementById('tMainTitle').textContent = dict.mainTitle;
      document.getElementById('tSubTitle').innerHTML = dict.subTitle;
      document.getElementById('tOfuseBtn').textContent = dict.ofuseBtn;
      document.getElementById('tNotice').innerHTML = dict.notice;
      document.getElementById('tDropTitle').textContent = dict.dropTitle;
      document.getElementById('tDropSub1').textContent = dict.dropSub1;
      copyBtnText.textContent = dict.copyJson;
      clearBtn.textContent = dict.clear;
      outputArea.placeholder = dict.placeholder;

      if (lang === 'ja') {
        langJpBtn.className = 'px-2 py-0.5 rounded font-medium transition bg-indigo-600 text-white';
        langEnBtn.className = 'px-2 py-0.5 rounded font-medium transition text-slate-400 hover:text-slate-200';
      } else {
        langEnBtn.className = 'px-2 py-0.5 rounded font-medium transition bg-indigo-600 text-white';
        langJpBtn.className = 'px-2 py-0.5 rounded font-medium transition text-slate-400 hover:text-slate-200';
      }

      if (lastLoadedFileInfo) {
        fileInfo.textContent = `✅ ${lastLoadedFileInfo.name} (${lastLoadedFileInfo.sizeKb}KB) - ${dict.detectedLabel}:${lastLoadedFileInfo.detectedType}`;
      } else {
        fileInfo.textContent = dict.noFile;
      }

      if (typeof gtag === 'function') {
        gtag('event', 'switch_language', { language: lang });
      }
    }

    // 支援リンククリック計測
    function trackDonate(platform) {
      if (typeof gtag === 'function') {
        gtag('event', 'click_donate', {
          platform: platform,
          source: 'prompt_checker'
        });
      }
    }

    // ドラッグ＆ドロップ対応
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('border-indigo-500', 'bg-slate-800/80');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('border-indigo-500', 'bg-slate-800/80');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files && files.length > 0) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    // コピー機能
    copyBtn.addEventListener('click', async () => {
      if (!outputArea.value) return;
      const dict = I18N[currentLang];
      try {
        await navigator.clipboard.writeText(outputArea.value);
        copyBtnText.textContent = dict.copied;
        setTimeout(() => { copyBtnText.textContent = dict.copyJson; }, 2000);

        if (typeof gtag === 'function') {
          gtag('event', 'copy_metadata', { source: 'prompt_checker' });
        }
      } catch (err) {
        alert(currentLang === 'ja' ? 'コピーに失敗しました' : 'Failed to copy');
      }
    });

    // クリア機能
    clearBtn.addEventListener('click', () => {
      const dict = I18N[currentLang];
      outputArea.value = '';
      lastLoadedFileInfo = null;
      fileInfo.textContent = dict.noFile;
      fileInput.value = '';
      copyBtn.disabled = true;
      clearBtn.disabled = true;
    });

    // ファイル解析処理
    async function handleFile(file) {
      const dict = I18N[currentLang];
      if (!file.name.toLowerCase().endsWith('.png')) {
        alert(dict.alertPng);
        return;
      }

      fileInfo.textContent = `${dict.analyzing}: ${file.name}...`;

      try {
        const buf = await file.arrayBuffer();
        const view = new DataView(buf);
        let offset = 8;
        const decoder = new TextDecoder('utf-8');
        const results = {};
        let chunkCount = 0;
        let detectedType = 'Unknown';

        while (offset < view.byteLength) {
          if (offset + 8 > view.byteLength) break;
          const len = view.getUint32(offset);
          const type = String.fromCharCode(
            view.getUint8(offset + 4), view.getUint8(offset + 5),
            view.getUint8(offset + 6), view.getUint8(offset + 7)
          );

          if (type === 'tEXt' || type === 'iTXt') {
            chunkCount++;
            const chunkData = new Uint8Array(buf, offset + 8, len);
            const raw = decoder.decode(chunkData);
            const key = type + '_' + offset;
            
            try {
              const nullIdx = raw.indexOf('\0');
              if (nullIdx !== -1) {
                const keyword = raw.substring(0, nullIdx);
                const textPart = raw.substring(nullIdx + 1);

                if (keyword === 'Comment') {
                  detectedType = 'NovelAI';
                } else if (keyword === 'parameters') {
                  detectedType = 'Stable Diffusion';
                } else if (keyword === 'prompt' || keyword === 'workflow') {
                  detectedType = 'ComfyUI';
                }

                try {
                  results[key] = {
                    keyword: keyword,
                    data: JSON.parse(textPart)
                  };
                } catch {
                  results[key] = {
                    keyword: keyword,
                    text: textPart
                  };
                }
              } else {
                results[key] = raw;
              }
            } catch {
              results[key] = raw;
            }
          }
          offset += 12 + len;
        }

        outputArea.value = JSON.stringify(results, null, 2);
        const sizeKb = (file.size / 1024).toFixed(1);
        lastLoadedFileInfo = { name: file.name, sizeKb, detectedType, chunkCount };
        fileInfo.textContent = `✅ ${file.name} (${sizeKb}KB) - ${dict.detectedLabel}:${detectedType}`;
        copyBtn.disabled = false;
        clearBtn.disabled = false;

        if (typeof gtag === 'function') {
          gtag('event', 'inspect_file', {
            file_size_kb: Math.round(file.size / 1024),
            chunk_count: chunkCount,
            detected_type: detectedType
          });
        }
      } catch (err) {
        fileInfo.textContent = `❌ ${err.message}`;
        outputArea.value = dict.errorPrefix + err.message;
      }
    }

    const userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    if (userLang.startsWith('en')) {
      switchLang('en');
    }
  </script>
</body>
</html>
