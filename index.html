<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AIプロンプトチェッカー (AI Prompt Checker)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YP8SRTJMH4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans p-4 md:p-8">

  
  <header class="max-w-4xl w-full mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-5">
    <div>
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">🔍</span>
        <h1 id="tMainTitle" class="text-xl md:text-2xl font-bold tracking-tight text-white">AIプロンプトチェッカー V1.0</h1>
      </div>
      <p id="tSubTitle" class="text-xs text-slate-400 mt-1">NovelAI / Stable Diffusion (WebUI・Forge・ComfyUI) PNGメタデータ直接解析・RAW抽出ツール</p>
    </div>

    
    <div class="flex flex-wrap items-center gap-2.5">
      
      <div class="inline-flex rounded-lg bg-slate-800 p-0.5 border border-slate-700 text-xs">
        <button id="langJpBtn" onclick="switchLang('ja')" class="px-2.5 py-1 rounded-md font-medium transition bg-indigo-600 text-white">JP</button>
        <button id="langEnBtn" onclick="switchLang('en')" class="px-2.5 py-1 rounded-md font-medium transition text-slate-400 hover:text-slate-200">EN</button>
      </div>

      <a href="https://ofuse.me/4729099c" target="_blank" rel="noopener noreferrer"
         onclick="trackDonate('ofuse')"
         class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-orange-600/20 hover:bg-orange-600/30 text-orange-400 border border-orange-500/30 text-xs font-semibold transition">
        <span>🧡</span>
        <span id="tOfuseBtn">OFUSEで支援</span>
      </a>
      <a href="https://buymeacoffee.com/nolasan" target="_blank" rel="noopener noreferrer"
         onclick="trackDonate('buymeacoffee')"
         class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-yellow-600/20 hover:bg-yellow-600/30 text-yellow-400 border border-yellow-500/30 text-xs font-semibold transition">
        <span>☕</span>
        <span>Buy Me a Coffee</span>
      </a>
    </div>
  </header>

  
  <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col space-y-4">

    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs bg-slate-800/60 border border-slate-700/60 rounded-xl px-4 py-3">
      <div class="flex items-start sm:items-center gap-2">
        <span class="text-emerald-400 text-sm">🛡️</span>
        <span id="tNotice" class="text-slate-300">
          <strong class="text-indigo-300">NovelAI・Stable Diffusion両対応：</strong>
          画像・プロンプト等の全データはブラウザ内でのみ完全ローカル処理され、外部サーバーへ送信されることは一切ありません。
        </span>
      </div>
    </div>

    
    <label id="dropZone" class="group border-2 border-dashed border-slate-700 hover:border-indigo-500/70 bg-slate-800/40 hover:bg-slate-800/80 transition-all rounded-2xl p-6 text-center cursor-pointer flex flex-col items-center justify-center space-y-2">
      <div class="w-12 h-12 rounded-full bg-indigo-500/10 group-hover:bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl transition">
        📥
      </div>
      <div id="tDropTitle" class="text-sm font-medium text-slate-200">
        クリックしてPNG画像を選択、またはドラッグ＆ドロップ
      </div>
      <div class="text-xs text-slate-400 space-y-0.5">
        <p id="tDropSub1">NovelAI (Commentチャンク) / Stable Diffusion (parameters・workflowチャンク)</p>
        <p id="tDropSub2" class="text-[11px] text-slate-400">tEXt / iTXt チャンクを含むあらゆるPNG画像に対応</p>
      </div>
      <input type="file" id="f" accept="image/png" class="hidden">
    </label>

    
    <div class="flex flex-wrap items-center justify-between gap-2 pt-2">
      <div id="fileInfo" class="text-xs font-mono text-indigo-300">
        ファイルが選択されていません
      </div>
      <div class="flex items-center gap-2">
        <button id="copyBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
          <span>📋</span>
          <span id="copyBtnText">JSONをコピー</span>
        </button>
        <button id="clearBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 border border-slate-700 text-xs font-medium transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>
          クリア
        </button>
      </div>
    </div>

    
    <div class="relative flex-1 min-h-[420px]">
      <textarea id="out" readonly spellcheck="false" placeholder="ここに解析されたメタデータ（JSONフォーマット）が表示されます..." class="w-full h-full min-h-[420px] rounded-2xl bg-slate-950 border border-slate-800 p-4 font-mono text-xs text-sky-400 focus:outline-none focus:border-indigo-500/50 resize-y"></textarea>
    </div>
  </main>

  <footer class="max-w-4xl w-full mx-auto mt-6 text-center text-xs text-slate-400">
    NAI Matrix Utilities &copy; 2026
  </footer>
