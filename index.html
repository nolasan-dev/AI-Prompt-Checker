<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans p-3 sm:p-6 md:p-8">

  
  <header class="max-w-4xl w-full mx-auto mb-3 sm:mb-5 pb-3 border-b border-slate-800">
    <div class="flex items-start justify-between gap-2">
      
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-xl sm:text-2xl">🔍</span>
          <h1 id="tMainTitle" class="text-lg sm:text-2xl font-bold tracking-tight text-white whitespace-nowrap">AIプロンプトチェッカー</h1>
          <span class="text-[11px] font-mono text-indigo-400 bg-indigo-950/80 px-1.5 py-0.5 rounded border border-indigo-800/60">V1.0</span>
        </div>
        <p id="tSubTitle" class="text-[11px] sm:text-xs text-slate-400 mt-1 leading-snug">
          <span>NovelAI / Stable Diffusion (WebUI・Forge・ComfyUI)</span><br class="block">
          <span>PNGメタデータ直接解析・RAW抽出ツール</span>
        </p>
      </div>

      
      <div class="flex flex-col sm:flex-row items-end sm:items-center gap-1.5 shrink-0">
        
        <div class="inline-flex rounded-md bg-slate-800 p-0.5 border border-slate-700 text-[11px]">
          <button id="langJpBtn" onclick="switchLang('ja')" class="px-2 py-0.5 rounded font-medium transition bg-indigo-600 text-white">JP</button>
          <button id="langEnBtn" onclick="switchLang('en')" class="px-2 py-0.5 rounded font-medium transition text-slate-400 hover:text-slate-200">EN</button>
        </div>

        
        <div class="flex items-center gap-1.5">
          <a href="https://ofuse.me/4729099c" target="_blank" rel="noopener noreferrer"
             onclick="trackDonate('ofuse')"
             class="flex items-center gap-1 px-2 py-1 rounded-md bg-orange-600/20 hover:bg-orange-600/30 text-orange-400 border border-orange-500/30 text-[11px] font-semibold transition whitespace-nowrap">
            <span>🧡</span>
            <span id="tOfuseBtn">OFUSE</span>
          </a>
          <a href="https://buymeacoffee.com/nolasan" target="_blank" rel="noopener noreferrer"
             onclick="trackDonate('buymeacoffee')"
             class="flex items-center gap-1 px-2 py-1 rounded-md bg-yellow-600/20 hover:bg-yellow-600/30 text-yellow-400 border border-yellow-500/30 text-[11px] font-semibold transition whitespace-nowrap">
            <span>☕</span>
            <span class="hidden sm:inline">Buy Me a Coffee</span>
            <span class="sm:hidden">Coffee</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  
  <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col space-y-2.5">

    
    <div class="text-[11px] bg-slate-800/50 border border-slate-700/50 rounded-lg px-3 py-1.5 flex items-center gap-1.5 text-slate-300">
      <span class="text-emerald-400 shrink-0">🛡️</span>
      <span id="tNotice" class="truncate">
        <strong class="text-indigo-300">完全ローカル解析：</strong>
        画像・プロンプトは一切外部送信されません。
      </span>
    </div>

    
    <label id="dropZone" class="group border border-dashed border-slate-700 hover:border-indigo-500/70 bg-slate-800/30 hover:bg-slate-800/70 transition-all rounded-xl p-3 sm:p-4 text-center cursor-pointer flex items-center justify-center gap-3">
      <div class="w-8 h-8 rounded-full bg-indigo-500/10 group-hover:bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-base shrink-0">
        📥
      </div>
      <div class="text-left min-w-0">
        <div id="tDropTitle" class="text-xs sm:text-sm font-semibold text-slate-200 truncate">
          PNG画像を選択 / ドロップ
        </div>
        <div id="tDropSub1" class="text-[10px] sm:text-xs text-slate-400 truncate">
          NovelAI / Stable Diffusion (WebUI・Forge・ComfyUI)
        </div>
      </div>
      <input type="file" id="f" accept="image/png" class="hidden">
    </label>

    
    <div class="flex items-center justify-between gap-2 pt-0.5">
      <div id="fileInfo" class="text-[11px] font-mono text-indigo-300 truncate max-w-[65%] sm:max-w-[75%]">
        ファイル未選択
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="copyBtn" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-[11px] font-medium transition flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
          <span>📋</span>
          <span id="copyBtnText">コピー</span>
        </button>
        <button id="clearBtn" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 border border-slate-700 text-[11px] font-medium transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>
          クリア
        </button>
      </div>
    </div>

    
    <div class="flex-1 min-h-[460px] sm:min-h-[520px] flex flex-col">
      <textarea id="out" readonly spellcheck="false" placeholder="ここに解析されたメタデータ（JSONフォーマット）が表示されます..." class="w-full flex-1 min-h-[460px] rounded-xl bg-slate-950 border border-slate-800 p-3 font-mono text-xs text-sky-400 focus:outline-none focus:border-indigo-500/50 resize-y leading-relaxed"></textarea>
    </div>
  </main>

  <footer class="max-w-4xl w-full mx-auto mt-3 text-center text-[10px] text-slate-400 pb-2">
    NAI Matrix Utilities &copy; 2026
  </footer>
